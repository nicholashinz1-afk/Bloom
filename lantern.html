<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A17" id="meta-theme">
<meta name="robots" content="noindex, nofollow">
<title>Lantern</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏮</text></svg>">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ── Themes ─────────────────────────────────────────────── */
:root {
  --bg: #1C1A17; --surface: #26231F; --edge: #33302A;
  --ink: #EDE6DA; --sec: #9A9285; --accent: #E8A33D;
  --accent-soft: rgba(232, 163, 61, 0.12);
  /* reading dial */
  --r-size: 18px; --r-lh: 1.7; --r-ls: 0em;
}
body.theme-paper {
  --bg: #F5F0E6; --surface: #FFFCF5; --edge: #E2DACA;
  --ink: #2A2620; --sec: #6E6557; --accent: #B4731F;
  --accent-soft: rgba(180, 115, 31, 0.10);
}

/* ── Base ───────────────────────────────────────────────── */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  transition: background-color 0.25s, color 0.25s;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, a:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Reading column: comfortable measure, centered on wide screens */
#app { max-width: 680px; margin: 0 auto; padding: 0 18px 60px; }

/* ── Header ─────────────────────────────────────────────── */
.top {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 0 12px; padding-top: calc(16px + env(safe-area-inset-top));
}
.top h1 { font-size: 20px; font-weight: 650; letter-spacing: 0.01em; flex: 1; }
.top .lamp { font-size: 22px; }
.iconbtn {
  min-width: 44px; min-height: 44px; border: 1px solid var(--edge); border-radius: 12px;
  background: var(--surface); font-size: 17px; display: inline-flex; align-items: center;
  justify-content: center; gap: 6px; padding: 0 12px; transition: border-color 0.2s;
}
.iconbtn:hover { border-color: var(--accent); }
.backbtn { font-size: 15px; color: var(--sec); }

/* ── Cards & buttons ────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--edge);
  border-radius: 16px; padding: 18px; margin-bottom: 14px;
}
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 50px; border-radius: 14px; font-size: 16px; font-weight: 600;
  border: 1px solid var(--edge); background: var(--surface); color: var(--ink);
  padding: 12px 16px; transition: border-color 0.2s, opacity 0.2s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1C1A17; }
.btn.primary:disabled { opacity: 0.5; cursor: default; }
.btn.danger-armed { border-color: #b0563c; color: #c96b4e; }
.row { display: flex; gap: 10px; }
.row .btn { width: auto; flex: 1; }

/* ── Library ────────────────────────────────────────────── */
.lib-item {
  background: var(--surface); border: 1px solid var(--edge); border-radius: 16px;
  padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px;
}
.lib-main { cursor: pointer; min-height: 44px; }
.lib-title { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; line-height: 1.35; }
.lib-sub { font-size: 13.5px; color: var(--sec); }
.lib-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.chip {
  font-size: 12px; padding: 4px 10px; border-radius: 99px;
  border: 1px solid var(--edge); color: var(--sec);
}
.chip.building { color: var(--accent); border-color: var(--accent); }
.chip.lowconf { color: var(--sec); }
.lib-del {
  margin-left: auto; min-height: 36px; min-width: 44px; font-size: 12.5px; color: var(--sec);
  background: none; border: 1px solid var(--edge); border-radius: 10px; padding: 6px 12px;
}

/* ── Add view ───────────────────────────────────────────── */
.dropzone {
  border: 2px dashed var(--edge); border-radius: 16px; padding: 28px 18px;
  text-align: center; color: var(--sec); font-size: 14.5px; line-height: 1.6;
  margin-bottom: 14px; transition: border-color 0.2s, background-color 0.2s;
}
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.thumb { position: relative; width: 76px; height: 100px; border-radius: 10px; overflow: hidden; border: 1px solid var(--edge); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button {
  position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%;
  border: none; background: rgba(0,0,0,0.65); color: #fff; font-size: 13px; line-height: 1;
}

/* ── Stage indicator ────────────────────────────────────── */
.stage {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  background: var(--accent-soft); border: 1px solid var(--edge); border-radius: 14px;
  margin-bottom: 14px; font-size: 14px; color: var(--sec);
}
.stage .lamp-glow { font-size: 18px; animation: lampPulse 2.2s ease-in-out infinite; }
@keyframes lampPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
.stage strong { color: var(--ink); font-weight: 600; }

.banner {
  border: 1px solid var(--edge); border-left: 3px solid var(--accent);
  border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--sec);
  line-height: 1.55; margin-bottom: 14px;
}
.banner.error { border-left-color: #b0563c; }

/* ── Guide & reading surface ────────────────────────────── */
.reading, .reading p { font-family: Georgia, "Times New Roman", serif; }
.reading {
  font-size: var(--r-size); line-height: var(--r-lh); letter-spacing: var(--r-ls);
}
.reading p { margin-bottom: 0.9em; }
.guide-h {
  font-family: Georgia, "Times New Roman", serif; font-size: 15px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px;
}
.guide-title { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
.guide-byline { font-size: 14px; color: var(--sec); margin-bottom: 16px; }
.vocab-term { color: var(--accent); font-weight: 700; font-family: Georgia, serif; font-size: calc(var(--r-size) * 1.0); }
.vocab-item { margin-bottom: 14px; }
.idea { margin-bottom: 16px; }
.idea-title { font-weight: 700; font-family: Georgia, serif; font-size: calc(var(--r-size) * 1.0); margin-bottom: 4px; }
.qlist { list-style: none; counter-reset: q; }
.qlist li { counter-increment: q; display: flex; gap: 12px; margin-bottom: 14px; }
.qlist li::before { content: counter(q); color: var(--accent); font-weight: 700; font-family: Georgia, serif; min-width: 18px; }
.tlist { list-style: none; }
.tlist li { display: flex; gap: 12px; margin-bottom: 12px; }
.tlist li::before { content: "◦"; color: var(--accent); font-weight: 700; }

/* ── Pages view ─────────────────────────────────────────── */
.pagenav { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; }
.pagenav button {
  min-width: 52px; min-height: 44px; border-radius: 12px; border: 1px solid var(--edge);
  background: var(--surface); font-size: 18px;
}
.pagenav button:disabled { opacity: 0.35; cursor: default; }
.pagenav select {
  flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--edge);
  background: var(--surface); color: var(--ink); font-size: 14.5px; padding: 0 12px;
  -webkit-appearance: none; appearance: none; text-align: center;
}

/* ── Dial sheet ─────────────────────────────────────────── */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); opacity: 0;
  pointer-events: none; transition: opacity 0.2s; z-index: 50;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  background: var(--surface); border-top: 1px solid var(--edge);
  border-radius: 20px 20px 0 0; padding: 16px 20px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform 0.25s ease; max-width: 680px; margin: 0 auto;
  max-height: 86vh; overflow-y: auto;
}
.sheet.open { transform: translateY(0); }
.sheet h2 { font-size: 16px; font-weight: 650; margin-bottom: 16px; }
.dial-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.dial-label { flex: 1; font-size: 14.5px; }
.dial-label small { display: block; color: var(--sec); font-size: 12px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button {
  width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--edge);
  background: var(--bg); font-size: 22px; font-weight: 600;
}
.stepper button:disabled { opacity: 0.3; cursor: default; }
.stepper .val { min-width: 52px; text-align: center; font-size: 14px; color: var(--sec); font-variant-numeric: tabular-nums; }
.theme-toggle { display: flex; gap: 8px; }
.theme-toggle button {
  flex: 1; min-height: 48px; border-radius: 12px; border: 1px solid var(--edge);
  background: var(--bg); font-size: 14.5px; font-weight: 600;
}
.theme-toggle button.sel { border-color: var(--accent); color: var(--accent); }

/* ── Vocabulary highlights ──────────────────────────────── */
.vocab-mark {
  background: var(--accent-soft); border-bottom: 1px dotted var(--accent);
  border-radius: 3px; padding: 0 2px; cursor: pointer; color: inherit;
}
.vocab-mark:hover { border-bottom-style: solid; }

/* ── Her highlights & notes ─────────────────────────────── */
.user-mark { background: rgba(240, 200, 90, 0.26); border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
body.theme-paper .user-mark { background: rgba(255, 220, 100, 0.5); }
.note-flag { color: var(--accent); font-size: 0.75em; margin-left: 3px; vertical-align: super; }
.note-input {
  width: 100%; min-height: 90px; border-radius: 12px; border: 1px solid var(--edge);
  background: var(--bg); color: var(--ink); font-family: inherit; font-size: 15px;
  padding: 12px; margin: 12px 0 16px; resize: vertical;
}
.note-row { cursor: pointer; padding: 10px 0; border-bottom: 1px solid var(--edge); min-height: 44px; }
.note-row:last-child { border-bottom: none; }
.note-row .muted { font-size: 13px; }
.note-quote { font-style: italic; font-family: Georgia, "Times New Roman", serif; font-size: 15px; line-height: 1.5; }

/* ── Ask / explain ──────────────────────────────────────── */
.explain-box {
  background: var(--accent-soft); border: 1px solid var(--edge); border-radius: 12px;
  padding: 12px 14px; margin: 0 0 12px; font-size: 15.5px; line-height: 1.6;
}
.readbar { height: 4px; border-radius: 2px; background: var(--edge); margin: 0 0 14px; overflow: hidden; }
.readbar > div { height: 100%; background: var(--accent); border-radius: 2px; }

/* ── Read-aloud ─────────────────────────────────────────── */
.tts-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.tts-bar .iconbtn { font-size: 15px; }
.s.speaking { background: var(--accent-soft); border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

.muted { color: var(--sec); font-size: 14px; line-height: 1.6; }
.spacer { height: 8px; }
a { color: var(--accent); }
</style>
</head>
<body>
<div id="app" role="main"></div>

<div class="sheet-backdrop" id="backdrop" onclick="closeSheets()"></div>
<div class="sheet" id="term-sheet" role="dialog" aria-modal="true" aria-label="Term definition">
  <h2 id="term-title" style="color:var(--accent);font-family:Georgia,'Times New Roman',serif;font-size:20px"></h2>
  <div class="reading" id="term-def" style="margin-bottom:18px"></div>
  <button class="btn" onclick="closeSheets()">Done</button>
</div>
<div class="sheet" id="note-sheet" role="dialog" aria-modal="true" aria-label="Highlight and note">
  <h2 id="note-title">Highlight this sentence</h2>
  <div class="muted note-quote" id="note-quote"></div>
  <div id="note-explain" style="margin-top:12px"></div>
  <button class="btn" id="note-explain-btn" onclick="explainSentence(false)" style="margin-top:12px">💡 What does this mean?</button>
  <textarea class="note-input" id="note-text" placeholder="Add a note (optional)" aria-label="Note for this sentence"></textarea>
  <div class="row">
    <button class="btn" id="note-secondary" onclick="removeNote()">Cancel</button>
    <button class="btn primary" id="note-primary" onclick="saveNote()">Highlight</button>
  </div>
</div>
<div class="sheet" id="ask-sheet" role="dialog" aria-modal="true" aria-label="Ask about this reading">
  <h2>Ask about this reading</h2>
  <div class="muted">Anything that's confusing or didn't click. Plain answers, no judgment.</div>
  <textarea class="note-input" id="ask-text" placeholder="What didn't make sense?" aria-label="Your question"></textarea>
  <div id="ask-answer"></div>
  <div class="row">
    <button class="btn" onclick="closeSheets()">Done</button>
    <button class="btn primary" id="ask-btn" onclick="askQuestion()">Ask</button>
  </div>
</div>
<div class="sheet" id="dial-sheet" role="dialog" aria-modal="true" aria-label="Reading settings">
  <h2>Reading dial</h2>
  <div class="dial-row">
    <div class="dial-label">Text size<small id="dv-size"></small></div>
    <div class="stepper">
      <button onclick="dial('size',-1)" aria-label="Smaller text">−</button>
      <span class="val" id="dval-size"></span>
      <button onclick="dial('size',1)" aria-label="Larger text">+</button>
    </div>
  </div>
  <div class="dial-row">
    <div class="dial-label">Line height<small>Space between lines</small></div>
    <div class="stepper">
      <button onclick="dial('lh',-1)" aria-label="Tighter lines">−</button>
      <span class="val" id="dval-lh"></span>
      <button onclick="dial('lh',1)" aria-label="Looser lines">+</button>
    </div>
  </div>
  <div class="dial-row">
    <div class="dial-label">Letter spacing<small>Space between letters</small></div>
    <div class="stepper">
      <button onclick="dial('ls',-1)" aria-label="Tighter letters">−</button>
      <span class="val" id="dval-ls"></span>
      <button onclick="dial('ls',1)" aria-label="Looser letters">+</button>
    </div>
  </div>
  <div class="dial-row">
    <div class="dial-label">Theme</div>
    <div class="theme-toggle" style="flex:1.4">
      <button id="dth-night" onclick="setReaderTheme('night')">Night</button>
      <button id="dth-paper" onclick="setReaderTheme('paper')">Paper</button>
    </div>
  </div>
  <div class="dial-row">
    <div class="dial-label">Vocabulary highlights<small>Tap a highlighted term for its meaning</small></div>
    <div class="theme-toggle" style="flex:1">
      <button id="dhl-on" onclick="setHighlight(true)">On</button>
      <button id="dhl-off" onclick="setHighlight(false)">Off</button>
    </div>
  </div>
  <button class="btn" onclick="closeDial()" style="margin-top:6px">Done</button>
</div>

<input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="file-photos" accept="image/*" multiple hidden>
<input type="file" id="file-pdf" accept="application/pdf,.pdf" hidden>
<input type="file" id="file-any" accept="image/*,application/pdf,.pdf" multiple hidden>

<script>
'use strict';
// ============================================================
//  Lantern — a reading companion.
//  Photograph or upload a course reading, get a plain-language
//  guide plus a clean readable version of the source pages.
//  Standalone page; talks to /api/lantern. All data stays on
//  this device (localStorage + IndexedDB).
// ============================================================

const API = '/api/lantern';
const MAX_PHOTOS = 60;
const MAX_PDF_PAGES = 100;
const IDENTIFY_PAGES = 3; // identification only needs the opening pages

// ── Tiny storage helpers ───────────────────────────────────
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

let idb = null;
function openDB() {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('lantern_db', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
      req.onsuccess = () => { idb = req.result; resolve(); };
      req.onerror = () => resolve();
    } catch (e) { resolve(); }
  });
}
function dbSet(key, value) {
  return new Promise((resolve) => {
    if (!idb) return resolve(false);
    try {
      const tx = idb.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}
function dbGet(key) {
  return new Promise((resolve) => {
    if (!idb) return resolve(null);
    try {
      const req = idb.transaction('kv').objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
function dbDel(key) {
  return new Promise((resolve) => {
    if (!idb) return resolve();
    try {
      const tx = idb.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch (e) { resolve(); }
  });
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Library metadata (small, in localStorage) ──────────────
// [{ id, createdAt, title, author, source, identified, confidence,
//    pageCount, pagesDone, identifyDone, guideDone, status, error }]
function getLibrary() { return LS.get('lantern_library', []); }
function setLibrary(lib) { LS.set('lantern_library', lib); }
function getMeta(id) { return getLibrary().find(g => g.id === id) || null; }
function saveMeta(meta) {
  const lib = getLibrary();
  const i = lib.findIndex(g => g.id === meta.id);
  if (i >= 0) lib[i] = meta; else lib.unshift(meta);
  setLibrary(lib);
}

// ── Reading dial settings ──────────────────────────────────
const DIAL_DEFAULTS = { size: 18, lh: 1.7, ls: 0, theme: 'night' };
const DIAL_RANGES = {
  size: { min: 14, max: 28, step: 1, fmt: v => v + 'px' },
  lh:   { min: 1.3, max: 2.4, step: 0.1, fmt: v => v.toFixed(1) },
  ls:   { min: 0, max: 0.12, step: 0.01, fmt: v => v.toFixed(2) + 'em' },
};
let dialSettings = Object.assign({}, DIAL_DEFAULTS, LS.get('lantern_settings', {}));

function applyDial() {
  const r = document.documentElement.style;
  r.setProperty('--r-size', dialSettings.size + 'px');
  r.setProperty('--r-lh', String(dialSettings.lh));
  r.setProperty('--r-ls', dialSettings.ls + 'em');
  document.body.classList.toggle('theme-paper', dialSettings.theme === 'paper');
  document.getElementById('meta-theme').setAttribute('content', dialSettings.theme === 'paper' ? '#F5F0E6' : '#1C1A17');
  // dial sheet readouts
  for (const k of ['size', 'lh', 'ls']) {
    const el = document.getElementById('dval-' + k);
    if (el) el.textContent = DIAL_RANGES[k].fmt(dialSettings[k]);
  }
  const n = document.getElementById('dth-night'), p = document.getElementById('dth-paper');
  if (n) n.classList.toggle('sel', dialSettings.theme !== 'paper');
  if (p) p.classList.toggle('sel', dialSettings.theme === 'paper');
  const hOn = document.getElementById('dhl-on'), hOff = document.getElementById('dhl-off');
  if (hOn) hOn.classList.toggle('sel', dialSettings.highlight !== false);
  if (hOff) hOff.classList.toggle('sel', dialSettings.highlight === false);
}
function setHighlight(on) {
  dialSettings.highlight = on;
  LS.set('lantern_settings', dialSettings);
  applyDial();
  render();
}
function dial(k, dir) {
  const r = DIAL_RANGES[k];
  const next = Math.round((dialSettings[k] + dir * r.step) * 100) / 100;
  dialSettings[k] = Math.min(r.max, Math.max(r.min, next));
  LS.set('lantern_settings', dialSettings);
  applyDial();
}
function setReaderTheme(t) {
  dialSettings.theme = t;
  LS.set('lantern_settings', dialSettings);
  applyDial();
}
let _dialTrigger = null;
function openDial() {
  _dialTrigger = document.activeElement;
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('dial-sheet').classList.add('open');
  applyDial();
  setTimeout(() => {
    const first = document.querySelector('#dial-sheet .stepper button');
    if (first) first.focus();
  }, 260);
}
function closeSheets() {
  document.getElementById('backdrop').classList.remove('open');
  document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
  if (_dialTrigger && _dialTrigger.focus) { try { _dialTrigger.focus(); } catch (e) {} }
  _dialTrigger = null;
}
const closeDial = closeSheets;
function openTerm(vi) {
  const c = _contentCache.content;
  const v = c && Array.isArray(c.vocabulary) ? c.vocabulary[vi] : null;
  if (!v) return;
  _dialTrigger = document.activeElement;
  document.getElementById('term-title').textContent = v.term || '';
  document.getElementById('term-def').textContent = v.definition || '';
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('term-sheet').classList.add('open');
  setTimeout(() => { const b = document.querySelector('#term-sheet .btn'); if (b) b.focus(); }, 260);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.querySelector('.sheet.open')) closeSheets();
});

// ── Her highlights & notes ─────────────────────────────────
// Anchored to sentences: tap one in the readable pages to highlight
// it and optionally attach a note. Stored per guide in IndexedDB as
// { "<page>:<sentenceIdx>": { text, note, ts } }. Page text never
// changes after transcription, so sentence indexes are stable.
let _notesCache = { id: null, map: {} };
let _noteTarget = null;
let _scrollTarget = null;

function getNotes() {
  return _notesCache.id === view.guideId ? _notesCache.map : {};
}
function openNote(s) {
  const c = _contentCache.id === view.guideId ? _contentCache.content : null;
  if (!c || !c.pages) return;
  const cur = Math.min(LS.get('lantern_pos_' + view.guideId, 0), (c.pages.length || 1) - 1);
  const sentence = ttsBuildQueue(c.pages[cur] || '')[s] || '';
  if (!sentence) return;
  _noteTarget = { page: cur, s, sentence };
  const existing = getNotes()[cur + ':' + s];
  document.getElementById('note-title').textContent = existing ? 'Your highlight' : 'Highlight this sentence';
  document.getElementById('note-quote').textContent = sentence.length > 160 ? sentence.slice(0, 157) + '…' : sentence;
  document.getElementById('note-text').value = existing ? (existing.note || '') : '';
  document.getElementById('note-secondary').textContent = existing ? 'Remove' : 'Cancel';
  document.getElementById('note-primary').textContent = existing ? 'Save' : 'Highlight';
  document.getElementById('note-explain').innerHTML = '';
  _lastExplanation = '';
  _dialTrigger = document.activeElement;
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('note-sheet').classList.add('open');
}
function saveNote() {
  if (!_noteTarget) return closeSheets();
  const map = getNotes();
  map[_noteTarget.page + ':' + _noteTarget.s] = {
    text: _noteTarget.sentence.slice(0, 300),
    note: document.getElementById('note-text').value.trim(),
    ts: Date.now(),
  };
  _notesCache = { id: view.guideId, map };
  dbSet('notes_' + view.guideId, map);
  _noteTarget = null;
  closeSheets();
  render();
}
function removeNote() {
  if (_noteTarget) {
    const map = getNotes();
    const key = _noteTarget.page + ':' + _noteTarget.s;
    if (map[key]) {
      delete map[key];
      dbSet('notes_' + view.guideId, map);
      render();
    }
  }
  _noteTarget = null;
  closeSheets();
}
function jumpToNote(page, s) {
  LS.set('lantern_pos_' + view.guideId, page);
  _scrollTarget = s;
  go('pages', view.guideId);
}

// ── Ask & explain (the anti-frustration path) ──────────────
// One tap on "What does this mean?" explains the tapped sentence with
// the whole page as context. "Even simpler" strips it down further.
// "Keep with my note" saves the explanation onto the highlight, so
// understanding accumulates in her notes list.
let _lastExplanation = '';

function askContext(meta, c) {
  return {
    title: meta.title, author: meta.author, source: meta.source,
    summary: (c && c.summary) || '',
  };
}

async function explainSentence(simpler) {
  if (!_noteTarget) return;
  const meta = getMeta(view.guideId);
  const c = _contentCache.id === view.guideId ? _contentCache.content : null;
  if (!meta || !c) return;
  const btn = document.getElementById('note-explain-btn');
  const out = document.getElementById('note-explain');
  btn.disabled = true;
  btn.textContent = '💡 Thinking it through…';
  try {
    const r = await api('ask', {
      context: askContext(meta, c),
      passage: _noteTarget.sentence,
      pageText: String((c.pages || [])[_noteTarget.page] || '').slice(0, 5000),
      simpler: !!simpler,
    });
    _lastExplanation = String(r.answer || '').trim();
    if (!_lastExplanation) throw new Error('No answer came back. Try again.');
    out.innerHTML = `<div class="explain-box reading">${escapeHtml(_lastExplanation)}</div>
      <div class="row">
        <button class="btn" onclick="explainSentence(true)">Even simpler</button>
        <button class="btn" onclick="keepExplanation()">Keep with my note</button>
      </div>`;
  } catch (e) {
    out.innerHTML = `<div class="banner error" style="margin-bottom:0">${escapeHtml(e.message)}</div>`;
  }
  btn.disabled = false;
  btn.textContent = '💡 What does this mean?';
}

function keepExplanation() {
  const ta = document.getElementById('note-text');
  if (_lastExplanation) {
    ta.value = (ta.value.trim() ? ta.value.trim() + '\n\n' : '') + _lastExplanation;
  }
  saveNote();
}

function openAsk() {
  _dialTrigger = document.activeElement;
  document.getElementById('ask-answer').innerHTML = '';
  document.getElementById('ask-text').value = '';
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('ask-sheet').classList.add('open');
  setTimeout(() => { const t = document.getElementById('ask-text'); if (t) t.focus(); }, 260);
}

async function askQuestion() {
  const q = document.getElementById('ask-text').value.trim();
  if (!q) return;
  const meta = getMeta(view.guideId);
  const c = _contentCache.id === view.guideId ? _contentCache.content : null;
  if (!meta) return;
  const btn = document.getElementById('ask-btn');
  const out = document.getElementById('ask-answer');
  btn.disabled = true;
  btn.textContent = 'Thinking…';
  try {
    const r = await api('ask', { context: askContext(meta, c), question: q });
    const answer = String(r.answer || '').trim();
    if (!answer) throw new Error('No answer came back. Try again.');
    out.innerHTML = `<div class="explain-box reading">${escapeHtml(answer)}</div>`;
  } catch (e) {
    out.innerHTML = `<div class="banner error" style="margin-bottom:12px">${escapeHtml(e.message)}</div>`;
  }
  btn.disabled = false;
  btn.textContent = 'Ask';
}

// ── View state & navigation ────────────────────────────────
// Views: library | add | guide | pages
let view = { name: 'library', guideId: null };
let pendingImages = []; // add view: [{ media_type, data }]

function go(name, guideId, replace) {
  if (typeof ttsStop === 'function' && tts.active) ttsStop(false);
  view = { name, guideId: guideId || null };
  const st = { name, guideId: view.guideId };
  if (replace) history.replaceState(st, '');
  else history.pushState(st, '');
  render();
}
window.addEventListener('popstate', (e) => {
  if (typeof ttsStop === 'function' && tts.active) ttsStop(false);
  if (e.state && e.state.name) {
    view = { name: e.state.name, guideId: e.state.guideId || null };
  } else {
    view = { name: 'library', guideId: null };
  }
  render();
});

// ── API ────────────────────────────────────────────────────
async function api(action, payload) {
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt > 0) await new Promise(r => setTimeout(r, 1500 * attempt));
    let res;
    try {
      res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ action }, payload)),
      });
    } catch (e) {
      lastErr = { message: 'No connection. Check your internet and retry.', retryable: true };
      continue;
    }
    if (res.ok) return res.json();
    const body = await res.json().catch(() => ({}));
    if (res.status === 429) {
      lastErr = { message: body.error || 'Lantern needs a break. Try again tomorrow.', retryable: false };
      break;
    }
    const retryable = body.retryable !== false && res.status >= 500;
    const detail = body.message ? ': ' + body.message : '';
    lastErr = { message: 'The build hit a snag (' + (body.error || res.status) + detail + ').', retryable };
    if (!retryable) break;
  }
  const err = new Error(lastErr.message);
  err.retryable = lastErr.retryable;
  throw err;
}

// ── Image intake ───────────────────────────────────────────
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
// Downscale to ~1568px long edge, JPEG q0.8. Returns { media_type, data }.
async function processImageFile(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    return canvasToPage(img, img.naturalWidth, img.naturalHeight);
  } finally {
    URL.revokeObjectURL(url);
  }
}
function canvasToPage(source, w, h) {
  const LONG = 1568;
  const scale = Math.min(1, LONG / Math.max(w, h));
  const cw = Math.round(w * scale), ch = Math.round(h * scale);
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(source, 0, 0, cw, ch);
  // Recompress if a pathologically detailed photo lands over the
  // request size budget; the server caps each image at 2.5MB base64.
  let quality = 0.8;
  let dataUrl = canvas.toDataURL('image/jpeg', quality);
  while (dataUrl.length > 1.6 * 1024 * 1024 && quality > 0.45) {
    quality -= 0.15;
    dataUrl = canvas.toDataURL('image/jpeg', quality);
  }
  return { media_type: 'image/jpeg', data: dataUrl.split(',')[1] };
}

async function addImageFiles(files) {
  const imgs = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  if (pendingImages.length + imgs.length > MAX_PHOTOS) {
    setAddNote('Lantern takes up to ' + MAX_PHOTOS + ' images per reading. For anything longer, split it into two readings.');
  }
  for (const f of imgs.slice(0, MAX_PHOTOS - pendingImages.length)) {
    try {
      pendingImages.push(await processImageFile(f));
    } catch (e) {
      setAddNote('One of those images could not be read. Try a different photo.');
    }
  }
  render();
}

let _addNote = '';
function setAddNote(msg) { _addNote = msg; render(); }

// ── PDF intake (pdf.js from cdnjs, fake-worker mode) ───────
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('script load failed'));
    document.head.appendChild(s);
  });
}
let _pdfReady = null;
function ensurePdfJs() {
  if (!_pdfReady) {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    _pdfReady = loadScript(base + 'pdf.min.js')
      .then(() => loadScript(base + 'pdf.worker.min.js'))
      .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; });
  }
  return _pdfReady;
}

let pdfProgress = null; // { current, total } while converting
async function handlePdfFile(file) {
  try {
    pdfProgress = { current: 0, total: 0 };
    render();
    await ensurePdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
    const total = Math.min(pdf.numPages, MAX_PDF_PAGES);
    pdfProgress = { current: 0, total };
    render();
    const pages = [];
    for (let p = 1; p <= total; p++) {
      const page = await pdf.getPage(p);
      const base = page.getViewport({ scale: 1 });
      const scale = 1568 / Math.max(base.width, base.height);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport }).promise;
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      pages.push({ media_type: 'image/jpeg', data: dataUrl.split(',')[1] });
      pdfProgress.current = p;
      render();
    }
    pdfProgress = null;
    await startBuild(pages, file.name.replace(/\.pdf$/i, ''));
  } catch (e) {
    pdfProgress = null;
    setAddNote('That PDF could not be read. If it opens normally on your device, try again; otherwise screenshot the pages and add them as photos.');
  }
}

// Pages can finish transcribing out of order; she reads in order, so
// "ready" means the unbroken run of finished pages from the start.
function readyPrefix(pages) {
  let n = 0;
  while (typeof (pages || [])[n] === 'string') n++;
  return n;
}

// ── Build pipeline ─────────────────────────────────────────
let _activeBuild = null;
let _buildContent = null; // live content object owned by the running build
const _buildQueue = [];   // guides waiting their turn; one build at a time

// Keep the screen awake during a multi-minute build so the phone
// doesn't sleep mid-transcription. Released when the queue drains.
let _wakeLock = null;
async function acquireWakeLock() {
  try {
    if (navigator.wakeLock && _activeBuild && !_wakeLock) {
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', () => { _wakeLock = null; });
    }
  } catch (e) {}
}
function releaseWakeLock() {
  try { if (_wakeLock) { _wakeLock.release(); _wakeLock = null; } } catch (e) {}
}

let _buildStarting = false;
async function startBuild(images, fallbackTitle) {
  if (_buildStarting) return; // a double-tap must not create two guides
  _buildStarting = true;
  try {
    await startBuildInner(images, fallbackTitle);
  } finally {
    _buildStarting = false;
  }
}
async function startBuildInner(images, fallbackTitle) {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  for (let i = 0; i < images.length; i++) {
    await dbSet('src_' + id + '_' + i, images[i]);
  }
  const meta = {
    id, createdAt: Date.now(),
    title: fallbackTitle || 'New reading', author: '', source: '',
    identified: false, confidence: null,
    pageCount: images.length, pagesDone: 0,
    identifyDone: false, guideDone: false,
    status: 'building', error: null,
  };
  saveMeta(meta);
  pendingImages = [];
  go('guide', id);
  runBuild(id);
}

async function runBuild(id) {
  if (_activeBuild) {
    // One build at a time; queue the rest instead of silently dropping
    // them (a second reading added mid-build used to hang forever).
    if (_activeBuild !== id && !_buildQueue.includes(id)) _buildQueue.push(id);
    return;
  }
  _activeBuild = id;
  acquireWakeLock();
  try {
    let meta = getMeta(id);
    if (!meta) return;
    meta.error = null;
    meta.status = 'building';
    saveMeta(meta);
    refreshIfViewing(id);

    const content = (await dbGet('guide_' + id)) || { pages: [] };
    // Keep the render cache pointed at this live object so every
    // refreshIfViewing shows stage results as they land, not the
    // empty snapshot loadContent grabbed before the build started.
    // _buildContent lets loadContent re-attach to this live object if
    // she navigates away and back mid-build.
    _contentCache = { id, content };
    _buildContent = { id, content };
    // loadContent is skipped while this cache is live, so make sure
    // any saved highlights and notes for a resumed guide get loaded.
    if (_notesCache.id !== id) {
      const notes = await dbGet('notes_' + id);
      if (_notesCache.id !== id) _notesCache = { id, map: notes || {} };
    }

    // Stage 1: identify (opening pages only; the server caps identify at 4 images)
    if (!meta.identifyDone) {
      const firstImgs = [];
      for (let i = 0; i < Math.min(meta.pageCount, IDENTIFY_PAGES); i++) {
        const img = await dbGet('src_' + id + '_' + i);
        if (img) firstImgs.push(img);
      }
      if (!firstImgs.length) throw Object.assign(new Error('The source pages for this reading are no longer on this device, so it can\'t be rebuilt. Delete it and add the reading again.'), { retryable: false });
      const r = await api('identify', { images: firstImgs });
      meta = getMeta(id);
      if (!meta) return; // deleted mid-build
      meta.title = r.title || 'Untitled reading';
      meta.author = r.author || '';
      meta.source = r.source || '';
      meta.identified = !!r.identified;
      meta.confidence = ['high', 'medium', 'low'].includes(r.confidence) ? r.confidence : 'low';
      meta.identifyDone = true;
      content.summary = r.summary || '';
      content.vocabulary = Array.isArray(r.vocabulary) ? r.vocabulary : [];
      await dbSet('guide_' + id, content);
      saveMeta(meta);
      refreshIfViewing(id);
    }

    // Stages 2 and 3 run concurrently: the guide body needs only the
    // first page plus identify context, and transcription doesn't
    // depend on the guide, so neither waits for the other.
    content.pages = content.pages || [];

    const guideStage = async () => {
      if (meta.guideDone) return;
      const first = await dbGet('src_' + id + '_0');
      if (!first) throw Object.assign(new Error('The source pages for this reading are no longer on this device. Delete it and add the reading again.'), { retryable: false });
      const r = await api('guide', {
        images: [first],
        context: { title: meta.title, author: meta.author, source: meta.source, summary: content.summary },
      });
      content.bigIdeas = Array.isArray(r.bigIdeas) ? r.bigIdeas : [];
      content.readingTips = Array.isArray(r.readingTips) ? r.readingTips : [];
      content.questions = Array.isArray(r.questions) ? r.questions : [];
      await dbSet('guide_' + id, content);
      const m = getMeta(id);
      if (!m) return;
      m.guideDone = true;
      delete m.guideFailReason;
      saveMeta(m);
      // Page 0's image doubles as the guide stage's input; now that
      // the guide is built it can go once page 0 is transcribed too.
      if (typeof content.pages[0] === 'string') dbDel('src_' + id + '_0');
      refreshIfViewing(id);
    };

    // Transcribe a few pages at a time instead of one by one; this is
    // where most of the build time lives. Completion can land out of
    // order, so meta.pagesDone tracks the contiguous prefix of pages
    // that are readable in sequence.
    const todo = [];
    for (let p = 0; p < meta.pageCount; p++) {
      if (typeof content.pages[p] !== 'string') todo.push(p);
    }
    let nextIdx = 0;
    let failure = null;
    let deletedMidBuild = false;
    const transcribeWorker = async () => {
      while (!failure && !deletedMidBuild) {
        const myIdx = nextIdx++;
        if (myIdx >= todo.length) return;
        const p = todo[myIdx];
        try {
          const src = await dbGet('src_' + id + '_' + p);
          if (!src) throw Object.assign(new Error('Page ' + (p + 1) + '\'s source image is no longer on this device. The pages already transcribed are saved.'), { retryable: false, srcLost: true });
          const r = await api('transcribe', { images: [src] });
          content.pages[p] = r.text || '';
          await dbSet('guide_' + id, content);
          const m = getMeta(id);
          if (!m) { deletedMidBuild = true; return; }
          m.pagesDone = readyPrefix(content.pages);
          saveMeta(m);
          // Page 0's image doubles as the guide stage's input; keep it
          // until the guide section is built.
          if (p !== 0 || m.guideDone) dbDel('src_' + id + '_' + p);
          refreshIfViewing(id);
        } catch (e) {
          if (e.retryable === false) {
            // One permanently failing page must not cost her the rest
            // of the reading. Leave a readable placeholder, note it,
            // and keep going. Its source image is kept for retries.
            content.pages[p] = e.srcLost
              ? 'This page\'s original image was lost before it could be transcribed, so it can\'t be recovered. The other pages are intact.'
              : 'Lantern couldn\'t transcribe this page automatically. Tap "Try failed pages again" on the guide to give it another shot.';
            await dbSet('guide_' + id, content);
            const m = getMeta(id);
            if (!m) { deletedMidBuild = true; return; }
            if (!e.srcLost) {
              m.failedPages = Array.isArray(m.failedPages) ? m.failedPages : [];
              if (!m.failedPages.includes(p)) m.failedPages.push(p);
            }
            m.pagesDone = readyPrefix(content.pages);
            saveMeta(m);
            refreshIfViewing(id);
            continue;
          }
          failure = failure || e;
          return;
        }
      }
    };

    let guideError = null;
    const guardedGuide = guideStage().catch(e => { guideError = e; });
    const POOL = 3;
    await Promise.all(Array.from({ length: Math.min(POOL, Math.max(todo.length, 1)) }, transcribeWorker));
    await guardedGuide;
    if (deletedMidBuild) return;
    if (failure) throw failure;
    if (guideError) {
      if (guideError.retryable === false) {
        // A permanent guide failure shouldn't block the pages she can
        // already read. Record why and surface a targeted retry.
        const m = getMeta(id);
        if (m) { m.guideFailReason = guideError.message || 'The guide sections could not be built.'; saveMeta(m); }
      } else {
        throw guideError;
      }
    }

    meta = getMeta(id);
    if (!meta) return; // deleted mid-build
    meta.status = 'complete';
    meta.error = null;
    saveMeta(meta);
    refreshIfViewing(id);
  } catch (e) {
    const meta = getMeta(id);
    if (meta) {
      meta.status = 'partial';
      meta.error = e.message || 'Something went wrong.';
      meta.errorRetryable = e.retryable !== false;
      saveMeta(meta);
    }
    refreshIfViewing(id);
  } finally {
    _activeBuild = null;
    _buildContent = null;
    const next = _buildQueue.shift();
    if (next) runBuild(next);
    else releaseWakeLock();
  }
}

function retryBuild(id) {
  if (_activeBuild) return;
  runBuild(id);
}

// Clear placeholder text from failed pages so the build's todo scan
// picks them up again. Their source images were kept for this.
async function retryFailedPages(id) {
  if (_activeBuild) return;
  const meta = getMeta(id);
  if (!meta || !Array.isArray(meta.failedPages) || !meta.failedPages.length) return;
  const content = (_buildContent && _buildContent.id === id)
    ? _buildContent.content
    : ((await dbGet('guide_' + id)) || { pages: [] });
  for (const p of meta.failedPages) content.pages[p] = null;
  await dbSet('guide_' + id, content);
  const m = getMeta(id);
  if (!m) return;
  m.failedPages = [];
  m.status = 'partial';
  m.pagesDone = readyPrefix(content.pages);
  saveMeta(m);
  if (_contentCache.id === id) _contentCache = { id, content };
  runBuild(id);
}

function refreshIfViewing(id) {
  if ((view.name === 'guide' || view.name === 'pages') && view.guideId === id) render();
  if (view.name === 'library') render();
}

// ── Delete (two-tap confirm) ───────────────────────────────
let _deleteArm = null;
function deleteGuide(id, btn) {
  if (_deleteArm !== id) {
    _deleteArm = id;
    btn.textContent = 'Tap again to delete';
    btn.classList.add('danger-armed');
    setTimeout(() => {
      if (_deleteArm === id) {
        _deleteArm = null;
        if (document.body.contains(btn)) { btn.textContent = 'Delete'; btn.classList.remove('danger-armed'); }
      }
    }, 4000);
    return;
  }
  _deleteArm = null;
  const meta = getMeta(id);
  setLibrary(getLibrary().filter(g => g.id !== id));
  dbDel('guide_' + id);
  dbDel('notes_' + id);
  LS.del('lantern_pos_' + id);
  if (meta) for (let i = 0; i < (meta.pageCount || 0); i++) dbDel('src_' + id + '_' + i);
  render();
}

// ── Rendering ──────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (view.name === 'add') app.innerHTML = renderAdd();
  else if (view.name === 'guide') app.innerHTML = renderGuide();
  else if (view.name === 'pages') app.innerHTML = renderPages();
  else app.innerHTML = renderLibrary();
  // Re-renders rebuild the DOM; restore the spoken-sentence highlight.
  if (view.name === 'pages' && tts.active) {
    const el = document.querySelector('.s[data-s="' + tts.idx + '"]');
    if (el) el.classList.add('speaking');
  }
  // Jumping to a highlight from the guide's notes list.
  if (view.name === 'pages' && _scrollTarget !== null) {
    const target = document.querySelector('.s[data-s="' + _scrollTarget + '"]');
    _scrollTarget = null;
    if (target) setTimeout(() => target.scrollIntoView({ block: 'center' }), 60);
  }
}

function header(backTo, backLabel, showDial, extra) {
  let left = '';
  if (backTo) {
    left = `<button class="iconbtn backbtn" onclick="${backTo}" aria-label="${escapeHtml(backLabel)}">‹ ${escapeHtml(backLabel)}</button>`;
  } else {
    left = `<span class="lamp" aria-hidden="true">🏮</span><h1>Lantern</h1>`;
  }
  const dialBtn = showDial ? `<button class="iconbtn" onclick="openDial()" aria-label="Reading settings">Aa</button>` : '';
  return `<div class="top">${left}${backTo ? '<div style="flex:1"></div>' : ''}${extra || ''}${dialBtn}</div>`;
}

function statusChip(g) {
  if (g.status === 'building') {
    if (!g.identifyDone) return '<span class="chip building">Reading the pages…</span>';
    if (!g.guideDone) return '<span class="chip building">Writing the guide…</span>';
    return `<span class="chip building">Pages ${g.pagesDone} of ${g.pageCount}…</span>`;
  }
  if (g.status === 'partial') return '<span class="chip">Paused, tap to resume</span>';
  if (g.confidence === 'low' || !g.identified) return '<span class="chip lowconf">Built from pages only</span>';
  return '';
}

function renderLibrary() {
  const lib = getLibrary();
  let html = header(null, null, true);
  html += `<button class="btn primary" onclick="pendingImages=[];_addNote='';go('add')" style="margin-bottom:18px">+ Add a reading</button>`;
  if (!lib.length) {
    html += `<div class="card muted">Photograph the pages of a course reading, or upload its PDF. Lantern builds a plain-language guide and a clean, readable version of the pages, and keeps them here.</div>`;
  }
  for (const g of lib) {
    const date = new Date(g.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    const sub = [g.author, g.source].filter(Boolean).join(' · ');
    html += `<div class="lib-item">
      <div class="lib-main" onclick="openGuide('${g.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openGuide('${g.id}')}">
        <div class="lib-title">${escapeHtml(g.title)}</div>
        ${sub ? `<div class="lib-sub">${escapeHtml(sub)}</div>` : ''}
        <div class="lib-sub">${escapeHtml(date)} · ${g.pageCount} page${g.pageCount === 1 ? '' : 's'}</div>
      </div>
      <div class="lib-foot">
        ${statusChip(g)}
        <button class="lib-del" onclick="event.stopPropagation();deleteGuide('${g.id}', this)">Delete</button>
      </div>
    </div>`;
  }
  return html;
}

function openGuide(id) {
  const meta = getMeta(id);
  if (!meta) return;
  go('guide', id);
  // Resume an interrupted build automatically; finished stages are kept.
  // Skip builds that can never succeed (source images gone).
  if (meta.status !== 'complete' && meta.errorRetryable !== false && !_activeBuild) runBuild(id);
}

function renderAdd() {
  let html = header("history.back()", 'Library', false);
  html += `<h1 style="font-size:22px;margin-bottom:14px;font-family:Georgia,serif">Add a reading</h1>`;

  if (pdfProgress) {
    const pct = pdfProgress.total ? Math.round(100 * pdfProgress.current / pdfProgress.total) : 0;
    html += `<div class="stage"><span class="lamp-glow" aria-hidden="true">🏮</span>
      <div>Preparing the PDF… <strong>${pdfProgress.total ? `page ${pdfProgress.current} of ${pdfProgress.total} (${pct}%)` : 'opening'}</strong></div></div>`;
    return html;
  }

  html += `<div class="dropzone" id="dropzone" role="button" tabindex="0" style="cursor:pointer"
    onclick="document.getElementById('file-any').click()"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('file-any').click()}">
    Drop a PDF or page photos here, paste a screenshot (Ctrl/Cmd+V),<br>or tap to browse
  </div>`;

  if (_addNote) html += `<div class="banner">${escapeHtml(_addNote)}</div>`;

  if (pendingImages.length) {
    html += `<div class="thumbs">` + pendingImages.map((img, i) =>
      `<div class="thumb"><img src="data:${img.media_type};base64,${img.data}" alt="Page ${i + 1}">
       <button onclick="pendingImages.splice(${i},1);render()" aria-label="Remove page ${i + 1}">✕</button></div>`
    ).join('') + `</div>`;
    html += `<button class="btn primary" onclick="startBuild(pendingImages.slice())" style="margin-bottom:14px">Build my guide (${pendingImages.length} page${pendingImages.length === 1 ? '' : 's'})</button>`;
  }

  html += `<div class="row" style="margin-bottom:10px">
    <button class="btn" onclick="document.getElementById('file-camera').click()">📷 Camera</button>
    <button class="btn" onclick="document.getElementById('file-photos').click()">🖼️ Photos</button>
  </div>
  <button class="btn" onclick="document.getElementById('file-pdf').click()">📄 Upload a PDF</button>
  <div class="spacer"></div>
  <div class="muted">A PDF is easiest if you can download one. Otherwise add photos or screenshots, one per page, in reading order. You can keep adding before you build. Photos work best straight-on with the whole page in frame.</div>`;
  return html;
}

function renderGuide() {
  const meta = getMeta(view.guideId);
  if (!meta) return header(null, null, true) + `<div class="card muted">That reading is no longer in the library.</div>`;
  const c = _contentCache.id === meta.id ? _contentCache.content : null;
  if (!c) { loadContent(meta.id); }

  const pagesBtn = meta.pagesDone > 0
    ? `<button class="iconbtn" onclick="go('pages','${meta.id}')" aria-label="Open readable pages">📖</button>`
    : '';
  let html = header("goLibrary()", 'Library', true, pagesBtn);
  html += `<div class="guide-title reading" style="font-size:calc(var(--r-size) * 1.3)">${escapeHtml(meta.title)}</div>`;
  const byline = [meta.author, meta.source].filter(Boolean).join(' · ');
  if (byline) html += `<div class="guide-byline">${escapeHtml(byline)}</div>`;

  // Honesty banner: never fake certainty.
  if (meta.identifyDone && (!meta.identified || meta.confidence === 'low')) {
    html += `<div class="banner">Lantern couldn't confidently identify this reading, so this guide is built only from the pages you provided, not from knowledge of the work.</div>`;
  }

  // Stage indicator / error
  if (meta.status === 'building') {
    let stageText;
    if (!meta.identifyDone) stageText = 'Reading the pages…';
    else if (!meta.guideDone) stageText = 'Writing your guide…';
    else stageText = `Turning pages into readable text… <strong>${meta.pagesDone} of ${meta.pageCount} done</strong>`;
    html += `<div class="stage" role="status" aria-live="polite"><span class="lamp-glow" aria-hidden="true">🏮</span><div>${stageText}</div></div>`;
  } else if (meta.status === 'partial' && meta.error) {
    html += `<div class="banner error">${escapeHtml(meta.error)}</div>`;
    html += `<button class="btn" onclick="retryBuild('${meta.id}')" style="margin-bottom:14px">Retry from where it stopped</button>`;
  }

  if (meta.status !== 'building' && meta.identifyDone && !meta.guideDone && meta.guideFailReason) {
    html += `<div class="banner error">The guide sections hit a snag: ${escapeHtml(meta.guideFailReason)}</div>
      <button class="btn" onclick="retryBuild('${meta.id}')" style="margin-bottom:14px">Try building the guide again</button>`;
  }
  if (meta.status !== 'building' && Array.isArray(meta.failedPages) && meta.failedPages.length) {
    html += `<div class="banner error">${meta.failedPages.length} page${meta.failedPages.length === 1 ? '' : 's'} couldn't be transcribed (page${meta.failedPages.length === 1 ? '' : 's'} ${meta.failedPages.map(p => p + 1).join(', ')}). Everything else is ready.</div>
      <button class="btn" onclick="retryFailedPages('${meta.id}')" style="margin-bottom:14px">Try failed pages again</button>`;
  }

  if (!c) return html + `<div class="card muted">Opening…</div>`;

  // Fixed section order.
  if (c.summary) {
    html += `<div class="card"><div class="guide-h">In three sentences</div><div class="reading">${paragraphs(c.summary)}</div></div>`;
  }
  if (c.vocabulary && c.vocabulary.length) {
    html += `<div class="card"><div class="guide-h">Decode the vocabulary first</div><div class="reading">` +
      c.vocabulary.map(v => `<div class="vocab-item"><span class="vocab-term">${escapeHtml(v.term)}</span><br>${escapeHtml(v.definition)}</div>`).join('') +
      `</div></div>`;
  }
  if (c.bigIdeas && c.bigIdeas.length) {
    html += `<div class="card"><div class="guide-h">The big ideas</div><div class="reading">` +
      c.bigIdeas.map(b => `<div class="idea"><div class="idea-title">${escapeHtml(b.title)}</div>${escapeHtml(b.body)}</div>`).join('') +
      `</div></div>`;
  }
  if (c.readingTips && c.readingTips.length) {
    html += `<div class="card"><div class="guide-h">How to read this author</div><ul class="tlist reading">` +
      c.readingTips.map(t => `<li>${escapeHtml(t)}</li>`).join('') + `</ul></div>`;
  }
  if (c.questions && c.questions.length) {
    html += `<div class="card"><div class="guide-h">Check yourself</div><ol class="qlist reading">` +
      c.questions.map(q => `<li>${escapeHtml(q)}</li>`).join('') + `</ol></div>`;
  }

  const noteEntries = Object.entries(getNotes()).map(([k, v]) => {
    const [pg, si] = k.split(':').map(Number);
    return { pg, si, text: v.text || '', note: v.note || '' };
  }).sort((a, b) => a.pg - b.pg || a.si - b.si);
  if (noteEntries.length) {
    html += `<div class="card"><div class="guide-h">Your highlights &amp; notes</div>` +
      noteEntries.map(n =>
        `<div class="note-row" onclick="jumpToNote(${n.pg},${n.si})" role="button" tabindex="0"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();jumpToNote(${n.pg},${n.si})}">
          <div class="muted">Page ${n.pg + 1}</div>
          <div class="note-quote">${escapeHtml(n.text.length > 140 ? n.text.slice(0, 137) + '…' : n.text)}</div>
          ${n.note ? `<div style="font-size:14px;margin-top:4px">✎ ${escapeHtml(n.note)}</div>` : ''}
        </div>`).join('') + `</div>`;
  }

  if (meta.identifyDone) {
    html += `<button class="btn" onclick="openAsk()" style="margin-bottom:10px">💬 Ask about this reading</button>`;
  }
  if (meta.pagesDone > 0) {
    const pos = LS.get('lantern_pos_' + meta.id, 0);
    const label = pos > 0
      ? `📖 Continue reading (page ${Math.min(pos, meta.pagesDone - 1) + 1} of ${meta.pageCount})`
      : `📖 Readable pages${meta.pagesDone < meta.pageCount ? ` (${meta.pagesDone} of ${meta.pageCount} ready)` : ''}`;
    html += `<button class="btn primary" onclick="go('pages','${meta.id}')">${label}</button>`;
  }
  return html;
}

function goLibrary() { go('library', null); }

function paragraphs(text) {
  return String(text || '').split(/\n{2,}|\r\n\r\n/).filter(s => s.trim())
    .map(p => `<p>${escapeHtml(p.trim())}</p>`).join('') || `<p>${escapeHtml(text)}</p>`;
}

// ── Reading text: sentences, vocab highlights ──────────────
function splitSentences(text) {
  const paras = [];
  for (const para of String(text || '').split(/\n{2,}|\r\n\r\n/)) {
    const t = para.trim();
    if (!t) continue;
    const sentences = (t.match(/[^.!?]+[.!?]+["”')\]]*\s*|[^.!?]+$/g) || [t])
      .map(s => s.trim()).filter(Boolean);
    if (sentences.length) paras.push(sentences);
  }
  return paras;
}

// Single pass with one combined alternation so a later term can never
// match inside markup injected for an earlier one (nested broken HTML).
function markVocab(escaped, vocab) {
  const terms = vocab
    .map((v, vi) => ({ t: escapeHtml(String(v.term || '').trim()), vi }))
    .filter(x => x.t.length >= 3)
    .sort((a, b) => b.t.length - a.t.length);
  if (!terms.length) return escaped;
  const alts = terms.map(x => x.t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  const re = new RegExp('(^|[^\\w&;])(' + alts + ')(?![\\w])', 'gi');
  return escaped.replace(re, (m, pre, hit) => {
    const found = terms.find(x => x.t.toLowerCase() === hit.toLowerCase());
    if (!found) return m;
    return pre + '<mark class="vocab-mark" role="button" tabindex="0" onclick="event.stopPropagation();openTerm(' + found.vi + ')" ' +
      'onkeydown="if(event.key===\'Enter\'){event.stopPropagation();openTerm(' + found.vi + ')}" ' +
      'aria-label="' + found.t + ', tap for definition">' + hit + '</mark>';
  });
}

// Renders a page's text as paragraphs of sentence spans. The span
// indexes line up with the read-aloud queue built by the same splitter.
// Sentences are tappable to highlight and annotate. The onclick spans
// deliberately carry no button role so screen readers hear prose, not
// a wall of buttons; annotation is a touch/mouse interaction.
function renderReadingHtml(text, vocab, page) {
  const paras = splitSentences(text);
  const doMark = dialSettings.highlight !== false && Array.isArray(vocab) && vocab.length;
  const notes = getNotes();
  let i = 0, html = '';
  for (const sentences of paras) {
    html += '<p>' + sentences.map(s => {
      let e = escapeHtml(s);
      if (doMark) e = markVocab(e, vocab);
      const ann = page != null ? notes[page + ':' + i] : null;
      const flag = ann && ann.note ? '<span class="note-flag" aria-hidden="true">✎</span>' : '';
      return `<span class="s${ann ? ' user-mark' : ''}" data-s="${i++}" onclick="openNote(${i - 1})">${e}${flag}</span>`;
    }).join(' ') + '</p>';
  }
  return html || '<p></p>';
}

// ── Read-aloud (built-in device voices, no server) ─────────
const TTS_RATES = [0.8, 1, 1.2, 1.5];
const ttsSupported = 'speechSynthesis' in window;
let tts = { active: false, gen: 0, queue: [], idx: 0, pageKey: null };

function ttsPageKey() {
  return view.guideId + ':' + LS.get('lantern_pos_' + view.guideId, 0);
}
function ttsBuildQueue(text) {
  const flat = [];
  for (const sentences of splitSentences(text)) for (const s of sentences) flat.push(s);
  return flat;
}
function ttsToggle() {
  if (!ttsSupported) return;
  if (tts.active) { ttsStop(true); render(); return; } // pause, keep position
  const meta = getMeta(view.guideId);
  const c = _contentCache.id === view.guideId ? _contentCache.content : null;
  if (!meta || !c || !c.pages) return;
  const cur = Math.min(LS.get('lantern_pos_' + meta.id, 0), (c.pages.length || 1) - 1);
  const key = ttsPageKey();
  if (tts.pageKey !== key) { tts.idx = 0; tts.pageKey = key; }
  tts.queue = ttsBuildQueue(c.pages[cur] || '');
  if (!tts.queue.length) return;
  if (tts.idx >= tts.queue.length) tts.idx = 0;
  tts.active = true;
  tts.gen++;
  render();
  speakNext(tts.gen);
}
function speakNext(gen) {
  if (gen !== tts.gen || !tts.active) return;
  if (tts.idx >= tts.queue.length) {
    // Auto-advance to the next ready page, or finish.
    const meta = getMeta(view.guideId);
    const c = _contentCache.id === view.guideId ? _contentCache.content : null;
    const ready = c && c.pages ? readyPrefix(c.pages) : 0;
    const cur = LS.get('lantern_pos_' + view.guideId, 0);
    if (meta && cur + 1 < ready) {
      LS.set('lantern_pos_' + view.guideId, cur + 1);
      tts.idx = 0;
      tts.pageKey = ttsPageKey();
      tts.queue = ttsBuildQueue(c.pages[cur + 1] || '');
      render();
      window.scrollTo({ top: 0 });
      speakNext(gen);
    } else {
      ttsStop(false);
      render();
    }
    return;
  }
  const u = new SpeechSynthesisUtterance(tts.queue[tts.idx]);
  u.rate = dialSettings.ttsRate || 1;
  u.onend = () => { if (gen !== tts.gen) return; tts.idx++; speakNext(gen); };
  u.onerror = () => { if (gen !== tts.gen) return; tts.idx++; speakNext(gen); };
  ttsHighlight(tts.idx); // onstart is unreliable on some Android voices
  speechSynthesis.speak(u);
}
function ttsStop(keepPosition) {
  tts.gen++;
  tts.active = false;
  if (!keepPosition) { tts.idx = 0; tts.pageKey = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
  document.querySelectorAll('.s.speaking').forEach(el => el.classList.remove('speaking'));
}
function ttsHighlight(i) {
  document.querySelectorAll('.s.speaking').forEach(el => el.classList.remove('speaking'));
  const el = document.querySelector('.s[data-s="' + i + '"]');
  if (el) {
    el.classList.add('speaking');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
  }
}
function ttsCycleRate() {
  const cur = dialSettings.ttsRate || 1;
  const next = TTS_RATES[(TTS_RATES.indexOf(cur) + 1) % TTS_RATES.length] || 1;
  dialSettings.ttsRate = next;
  LS.set('lantern_settings', dialSettings);
  const wasActive = tts.active;
  if (wasActive) { ttsStop(true); }
  render();
  if (wasActive) ttsToggle();
}

// Guide content cache (loaded async from IndexedDB)
let _contentCache = { id: null, content: null };
let _loadingContent = null;
async function loadContent(id) {
  if (_loadingContent === id) return;
  // While a build owns this guide, always re-attach to its live
  // object: navigating away and back must not leave the view on a
  // stale database snapshot that stops updating.
  if (_buildContent && _buildContent.id === id) {
    _contentCache = { id, content: _buildContent.content };
    if (_notesCache.id !== id) {
      const notes = await dbGet('notes_' + id);
      if (_notesCache.id !== id) _notesCache = { id, map: notes || {} };
    }
    if ((view.name === 'guide' || view.name === 'pages') && view.guideId === id) render();
    return;
  }
  _loadingContent = id;
  const [content, notes] = await Promise.all([dbGet('guide_' + id), dbGet('notes_' + id)]);
  _loadingContent = null;
  if (_notesCache.id !== id) _notesCache = { id, map: notes || {} };
  // Never clobber the live object a running build is writing into,
  // and don't replace real cached content with an empty fallback
  // (a slow dbGet can resolve after the build has already started).
  if (_contentCache.id === id && _contentCache.content && (_activeBuild === id || !content)) return;
  _contentCache = { id, content: content || { pages: [] } };
  if ((view.name === 'guide' || view.name === 'pages') && view.guideId === id) render();
}

function renderPages() {
  const meta = getMeta(view.guideId);
  if (!meta) return header(null, null, true) + `<div class="card muted">That reading is no longer in the library.</div>`;
  const c = _contentCache.id === meta.id ? _contentCache.content : null;
  if (!c) { loadContent(meta.id); }

  let html = header("history.back()", 'Guide', true);
  html += `<div class="guide-byline" style="margin-bottom:10px">${escapeHtml(meta.title)}</div>`;

  if (!c) return html + `<div class="card muted">Opening…</div>`;
  const ready = readyPrefix(c.pages);
  if (!ready) return html + `<div class="card muted">No readable pages yet. They appear here as each page finishes.</div>`;

  let cur = LS.get('lantern_pos_' + meta.id, 0);
  if (cur >= ready) cur = ready - 1;
  if (cur < 0) cur = 0;

  const opts = [];
  for (let i = 0; i < ready; i++) opts.push(`<option value="${i}"${i === cur ? ' selected' : ''}>Page ${i + 1} of ${meta.pageCount}</option>`);

  html += `<div class="pagenav">
    <button onclick="setPage(${cur - 1})" ${cur === 0 ? 'disabled' : ''} aria-label="Previous page">‹</button>
    <select onchange="setPage(parseInt(this.value,10))" aria-label="Jump to page">${opts.join('')}</select>
    <button onclick="setPage(${cur + 1})" ${cur >= ready - 1 ? 'disabled' : ''} aria-label="Next page">›</button>
  </div>`;

  html += `<div class="readbar" aria-hidden="true"><div style="width:${Math.round(100 * (cur + 1) / meta.pageCount)}%"></div></div>`;

  if (meta.status === 'building' && meta.pagesDone < meta.pageCount) {
    html += `<div class="stage" role="status" aria-live="polite"><span class="lamp-glow" aria-hidden="true">🏮</span><div>Still transcribing… <strong>${meta.pagesDone} of ${meta.pageCount} ready</strong></div></div>`;
  } else if (meta.status === 'partial' && meta.pagesDone < meta.pageCount) {
    html += `<div class="banner">The rest of the pages are paused (${meta.pagesDone} of ${meta.pageCount} done).${meta.errorRetryable !== false ? '' : ' ' + escapeHtml(meta.error || '')}</div>`;
    if (meta.errorRetryable !== false) {
      html += `<button class="btn" onclick="retryBuild('${meta.id}')" style="margin-bottom:14px">Resume the rest</button>`;
    }
  }

  if (ttsSupported) {
    const rate = dialSettings.ttsRate || 1;
    html += `<div class="tts-bar">
      <button class="iconbtn" onclick="ttsToggle()" aria-label="${tts.active ? 'Pause reading aloud' : 'Read this page aloud'}">${tts.active ? '⏸ Pause' : '▶ Listen'}</button>
      <button class="iconbtn" onclick="ttsCycleRate()" aria-label="Reading speed, currently ${rate} times">${rate}×</button>
      ${tts.active ? '<span class="muted">Reading aloud…</span>' : ''}
    </div>`;
  }

  html += `<div class="card reading">${renderReadingHtml(c.pages[cur] || '', c.vocabulary, cur)}</div>`;

  html += `<div class="pagenav">
    <button onclick="setPage(${cur - 1})" ${cur === 0 ? 'disabled' : ''} aria-label="Previous page">‹</button>
    <span class="muted" style="flex:1;text-align:center">Page ${cur + 1} of ${meta.pageCount}</span>
    <button onclick="setPage(${cur + 1})" ${cur >= ready - 1 ? 'disabled' : ''} aria-label="Next page">›</button>
  </div>`;
  return html;
}

function setPage(n) {
  if (tts.active) ttsStop(false);
  tts.idx = 0; tts.pageKey = null;
  LS.set('lantern_pos_' + view.guideId, Math.max(0, n));
  render();
  window.scrollTo({ top: 0 });
}

// ── File inputs, drag-drop, paste ──────────────────────────
document.getElementById('file-camera').addEventListener('change', (e) => {
  addImageFiles(e.target.files); e.target.value = '';
});
document.getElementById('file-photos').addEventListener('change', (e) => {
  addImageFiles(e.target.files); e.target.value = '';
});
document.getElementById('file-pdf').addEventListener('change', (e) => {
  if (e.target.files[0]) handlePdfFile(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('file-any').addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  const pdf = files.find(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (pdf) handlePdfFile(pdf);
  else addImageFiles(files);
  e.target.value = '';
});

document.addEventListener('dragover', (e) => {
  if (view.name !== 'add') return;
  e.preventDefault();
  const dz = document.getElementById('dropzone');
  if (dz) dz.classList.add('over');
});
document.addEventListener('dragleave', (e) => {
  const dz = document.getElementById('dropzone');
  if (dz && (!e.relatedTarget || !document.body.contains(e.relatedTarget))) dz.classList.remove('over');
});
document.addEventListener('drop', (e) => {
  if (view.name !== 'add') return;
  e.preventDefault();
  const dz = document.getElementById('dropzone');
  if (dz) dz.classList.remove('over');
  const files = Array.from(e.dataTransfer.files || []);
  const pdf = files.find(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (pdf) handlePdfFile(pdf);
  else addImageFiles(files);
});
document.addEventListener('paste', (e) => {
  if (view.name !== 'add') return;
  const items = Array.from(e.clipboardData?.items || []);
  const files = items.filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); addImageFiles(files); }
});

// When she returns to the app: keep the wake lock alive for a running
// build, and quietly resume a paused, retryable build she's looking
// at, so the Retry button is a fallback rather than a requirement.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (_activeBuild) { acquireWakeLock(); return; }
  const id = view.guideId;
  if (!id) return;
  const m = getMeta(id);
  if (m && m.status === 'partial' && m.errorRetryable !== false) runBuild(id);
});

// ── Boot ───────────────────────────────────────────────────
(async function main() {
  await openDB();
  // Ask the browser to treat her library as durable storage so it
  // isn't evicted under storage pressure. Best effort, silent.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  applyDial();
  // Mark anything that was mid-build when the app was killed as resumable.
  const lib = getLibrary();
  let changed = false;
  for (const g of lib) {
    if (g.status === 'building') { g.status = 'partial'; g.error = null; changed = true; }
  }
  if (changed) setLibrary(lib);
  history.replaceState({ name: 'library', guideId: null }, '');
  render();
})();
</script>
</body>
